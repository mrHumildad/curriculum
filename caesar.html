<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caesar Cipher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
    .copy-btn {
      background-color: #28a745;
      margin-top: 10px;
    }
    .copy-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Caesar Cipher Encoder</h1>
    <input type="text" id="inputString" placeholder="Enter your text here" />
    <input type="number" id="shiftValue" placeholder="Enter shift value" value="3"/>
    <br>
    <button onclick="encodeCaesar()">Encode</button>
    <div class="result" id="resultDisplay"></div>
    <button class="copy-btn" id="copyButton" style="display: none;" onclick="copyToClipboard()">Copy to Clipboard</button>
  </div>
  <script>
    function caesarCipher(str, shift) {
      let result = "";
      for (let i = 0; i < str.length; i++) {
        let charCode = str.charCodeAt(i);
        if (charCode >= 65 && charCode <= 90) {
          result += String.fromCharCode((charCode - 65 + shift) % 26 + 65);
        } else if (charCode >= 97 && charCode <= 122) {
          result += String.fromCharCode((charCode - 97 + shift) % 26 + 97);
        } else {
          result += str[i];
        }
      }
      return result;
    }
    function encodeCaesar() {
      const str = document.getElementById("inputString").value;
      const shift = parseInt(document.getElementById("shiftValue").value);
      if (isNaN(shift)) {
        document.getElementById("resultDisplay").innerText = "Please enter a valid shift number!";
        document.getElementById("copyButton").style.display = "none";
        return;
      }
      const baseURL = 'https://mrhumildad.github.io/curriculum/?x=';
      const result = baseURL + caesarCipher(str, shift);
      document.getElementById("resultDisplay").innerText = "Encoded Text: " + result;
      document.getElementById("copyButton").style.display = "inline-block";
    }
    function copyToClipboard() {
      const resultText = document.getElementById("resultDisplay").innerText.replace("Encoded Text: ", "");
      const tempInput = document.createElement("input");
      document.body.appendChild(tempInput);
      tempInput.value = resultText;
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);
      alert("Text copied to clipboard!");
    }
  </script>
</body>
</html>
